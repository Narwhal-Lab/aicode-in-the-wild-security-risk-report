tldr: GitLab Duo Claude Agent 在特定条件下会处理开发者能够控制的配置来源，使具备 Developer 权限的用户有机会把配置内容带入 Agent 的执行链，并在 CI 环境中运行任意命令。GitLab
  已在 19.1.7、19.2.5 和 19.3.1 修复。
