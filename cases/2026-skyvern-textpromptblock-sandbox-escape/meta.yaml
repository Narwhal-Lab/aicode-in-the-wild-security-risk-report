tldr: Skyvern 1.0.45 之前的 TextPromptBlock 会把已由沙箱化 Jinja 环境处理过的提示再次交给普通 Jinja 环境渲染。来自工作流参数或上游块输出的模板语法因此可能在第二次渲染时被执行，最终获得 Skyvern 服务进程权限。修复提交删除了这次非沙箱渲染，公开材料未显示该漏洞已被用于真实攻击。
tags:
  - ai-security
  - browser-agent
  - sandbox-escape
  - ssti
  - workflow-security
verification_notes: The VulnCheck and GitHub advisory records agree on the affected component, attack inputs, impact, CVE and fixed floor. The project commit shows the vulnerable second render being removed and adds regression tests; the v1.0.45 release contains that commit. Skyvern documentation confirms that Text Prompt is an LLM block and that workflow parameters and upstream outputs are normal inputs. No cited source reports exploitation in the wild.
