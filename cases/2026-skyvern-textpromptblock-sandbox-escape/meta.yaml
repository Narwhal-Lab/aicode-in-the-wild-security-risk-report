slug: 2026-skyvern-textpromptblock-sandbox-escape
title_en: Skyvern TextPromptBlock Sandbox Escape
title_cn: Skyvern 文本提示块二次渲染导致沙箱逃逸
year: 2026
disclosed: 2026-08-29
category: code-vulns
severity: high
cve: CVE-2026-82447
severity_basis: cvss
severity_evidence: GitHub Advisory Database records a CVSS 4.0 base score of 8.7. An attacker with low privileges can place Jinja syntax in workflow parameters or upstream block output and reach code execution with the Skyvern server process privileges.
real_incident: true
reproducible: true
fixed: 1.0.45
